name: Build and publish nemo-switchyard-vgr

# This fork's own builds, published as nemo-switchyard-vgr so they never collide with the
# upstream nemo-switchyard release. A vgr-vX.Y.Z tag publishes to PyPI and creates a GitHub
# Release; upstream's publish.yml only runs on vX.Y.Z tags. A manual run builds artifacts only.

on:
  push:
    tags:
      - "vgr-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to stamp on the artifacts (never published)."
        required: true
        type: string
        default: "0.0.0.dev0"

env:
  PACKAGE_NAME: "nemo-switchyard-vgr"
  MATURIN_VERSION: "1.11.5"

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          version = os.environ["INPUT_VERSION"] or os.environ["REF_NAME"].removeprefix("vgr-v")
          if not re.fullmatch(r"\d+\.\d+\.\d+((a|b|rc)\d+)?(\.post\d+)?(\.dev\d+)?", version):
              raise SystemExit(f"tags must look like vgr-vMAJOR.MINOR.PATCH (PEP 440 suffixes allowed), got {version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          print(f"building {os.environ.get('PACKAGE_NAME', 'nemo-switchyard-vgr')} {version}")
          PY

  wheels:
    name: Wheel (${{ matrix.label }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            manylinux_arch: x86_64
            smoke: true
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            manylinux_arch: aarch64
            smoke: false
          - label: macos-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            smoke: true
          - label: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            smoke: true
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            smoke: true
          - label: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp package name and version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          text, names = re.subn(r'^name = "nemo-switchyard"$', f'name = "{os.environ["PACKAGE_NAME"]}"',
                                text, count=1, flags=re.M)
          text, versions = re.subn(r'^version = "[^"]+"$', f'version = "{os.environ["VERSION"]}"',
                                   text, count=1, flags=re.M)
          if (names, versions) != (1, 1):
              raise SystemExit("pyproject.toml no longer has the [project] name and version lines this stamps")
          path.write_text(text)
          print(f"stamped {os.environ['PACKAGE_NAME']} {os.environ['VERSION']}")
          PY
      - name: Setup QEMU for Linux cross builds
        if: runner.os == 'Linux' && runner.arch != 'ARM64' && matrix.manylinux_arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Install maturin
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==${MATURIN_VERSION}"
      - name: Install Rust target
        if: runner.os != 'Linux'
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -e MATURIN_VERSION="${MATURIN_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/io" \
            -w /io \
            "quay.io/pypa/manylinux2014_${{ matrix.manylinux_arch }}" \
            /bin/bash -lc '
              set -euxo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              source "${HOME}/.cargo/env"
              PYTHON=/opt/python/cp312-cp312/bin/python
              "${PYTHON}" -m pip install --upgrade pip
              "${PYTHON}" -m pip install "maturin==${MATURIN_VERSION}"
              "${PYTHON}" -m maturin build \
                --release \
                --locked \
                --compatibility pypi \
                --out dist \
                --interpreter "${PYTHON}"
            '
      - name: Build native wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m maturin build \
            --release \
            --locked \
            --compatibility pypi \
            --out dist \
            --target "${{ matrix.rust_target }}"
      - name: Smoke install wheel
        if: ${{ matrix.smoke }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import os
          import sys
          import tempfile
          from importlib.metadata import version

          os.chdir(tempfile.mkdtemp(prefix="switchyard-wheel-smoke-"))
          workspace = os.environ.get("GITHUB_WORKSPACE")
          sys.path = [entry for entry in sys.path if entry not in ("", workspace)]

          from switchyard_rust.server import Server

          installed = version(os.environ["PACKAGE_NAME"])
          if installed != os.environ["VERSION"]:
              raise SystemExit(f"installed {installed}, expected {os.environ['VERSION']}")
          print(os.environ["PACKAGE_NAME"], installed, Server)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nemo-switchyard-vgr-wheel-${{ matrix.label }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vgr-v') }}
    needs: [version, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nemo-switchyard-vgr-wheel-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@v6
      - name: List distributions
        run: ls -l dist
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
